# Reviewable proposal only. Apply after BT14 host budget/access approval.
# One paid service owns the sole disk; HTTP workers never create execution owners.
services:
  - type: web
    name: binance-topdown-dashboard
    runtime: python
    region: oregon
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: python run_supervised.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/trading
      - key: TRADING_MODE
        value: paper
      - key: BINANCE_VENUE
        value: testnet
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: ALLOW_EXCHANGE_EXECUTION
        value: "false"
      - key: ALLOW_MAINNET_EXECUTION
        value: "false"
      - key: OPERATOR_ALERT_DELIVERY_AUTHORIZED
        value: "false"
      - key: OPERATOR_USERNAME
        sync: false
      - key: OPERATOR_PASSWORD_HASH
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: OPERATOR_ALERT_WEBHOOK
        sync: false
    disk:
      name: trading-state
      mountPath: /var/data/trading
      sizeGB: 1
