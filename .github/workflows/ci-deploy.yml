name: Verified release

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      authorize_release:
        description: Deploy the verified revision through the approved production environment
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
            requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Clean dependency installation
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Offline behavior and recovery
        run: python tools/check_baseline.py --timeout 600 --ticket BT14 --output bt14-ci-evidence.json
      - name: Static and type checks
        run: |
          python -c "import subprocess,sys; paths=subprocess.check_output(['git','ls-files','--','*.py'],text=True).splitlines(); raise SystemExit(subprocess.call([sys.executable,'-m','pyflakes',*paths]))"
          python -m mypy
          python -c "import subprocess,py_compile; paths=subprocess.check_output(['git','ls-files','--','*.py'],text=True).splitlines(); [py_compile.compile(p,doraise=True) for p in paths]"
      - name: Dashboard build and real offline browser journeys
        run: |
          npm ci
          npm run build:css
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:browser:orders
      - name: Store verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.sha }}
          path: |
            bt14-ci-evidence.json
            docs/planning/trading-remediation/evidence/bt13-browser/
          if-no-files-found: error

  release:
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.authorize_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Deploy only this verified commit and verify recovery service readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RELEASE_HEALTH_URL: ${{ vars.RELEASE_HEALTH_URL }}
          RELEASE_APPROVED_PLAN: ${{ vars.RELEASE_APPROVED_PLAN }}
          RELEASE_REVISION: ${{ github.sha }}
        run: python tools/release_verified.py
