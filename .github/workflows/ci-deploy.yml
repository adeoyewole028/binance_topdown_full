name: CI & Deploy

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Offline regression baseline
        run: python tools/check_baseline.py

      - name: Baseline lint and type check
        run: |
          python -m pyflakes tests tools/check_baseline.py
          python -m mypy

      - name: Lint (pyflakes)
        run: |
          python -m pyflakes .

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render (main)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy."
          fi

  deploy-staging:
    needs: build-test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render (staging)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL_STAGING not set; skipping staging deploy."
          fi
